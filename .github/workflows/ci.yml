name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Tests that call Bitrefill skip themselves without BITREFILL_API_KEY.
      - run: pnpm test
      - run: pnpm --filter @luckout/web build

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            contract/target
          key: cargo-${{ hashFiles('contract/Cargo.lock', 'contract/rust-toolchain.toml') }}
      # rustup reads contract/rust-toolchain.toml
      - run: cargo test --workspace

  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t luckout-server .
      # Without env the server falls back to PGlite and reports healthy.
      - run: |
          docker run -d --name luckout -p 8787:8787 luckout-server
          for i in $(seq 1 30); do curl -fs --max-time 3 localhost:8787/health && exit 0; sleep 1; done
          docker logs luckout; exit 1
      - run: touch deploy/.env && docker compose -f deploy/compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci
          API_DOMAIN: api.example.com
