name: CI
on:
  push:
    branches: [main, staging, testnet]
  pull_request:

# A new push to a PR cancels that PR's run still in progress. Pushes to main, staging and testnet each get
# their own group (head_ref is empty there), so every one of their commits is still tested and deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Live tests (Bitrefill, 1Click) run only with LIVE_TESTS=1, never here.
      - run: pnpm test
      - run: pnpm --filter @luckout/web build

  # Known advisories in what we ship (devDependencies left out), at high or critical. Its own job, so a newly
  # published advisory turns the commit red without holding up a deploy. Accepted ones are listed, each with
  # its reason, under auditConfig in pnpm-workspace.yaml. It reads only the lockfile: nothing to install.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # The registry's audit service being down isn't a finding.
      - run: pnpm audit --prod --audit-level high --ignore-registry-errors

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            contract/target
          key: cargo-${{ hashFiles('contract/Cargo.lock', 'contract/rust-toolchain.toml') }}
      # rustup reads contract/rust-toolchain.toml
      - run: cargo test --workspace
      - run: cargo test -p luckout --features migrate

  # The contract built reproducibly (in the Docker image pinned in contract/Cargo.toml), so anyone can
  # rebuild it byte for byte. Its code hash is what `contract/upgrade.sh` deploys and checks onchain,
  # and what /fair shows. Download it with: gh run download <run id> -n luckout-wasm-<commit>
  # It runs alongside the tests rather than after them (the slowest job, ~2 min); a commit whose
  # tests fail has a red run, and only green commits reach main to be released.
  contract-wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned by its sha256, as the actions are by commit: this job's luckout.wasm is what contract/upgrade.sh
      # deploys to mainnet. The installer in turn checks the sha256 of the cargo-near binary it downloads.
      - run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/cargo-near-installer.sh" https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh
          echo "76ae71bc6a99864a09cc67c1c0bf82a2b7812d8ab4c93034b680235df6d22028  $RUNNER_TEMP/cargo-near-installer.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/cargo-near-installer.sh"
      - run: cargo near build reproducible-wasm
      - run: python3 code-hash.py target/near/luckout.wasm | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luckout-wasm-${{ github.sha }}
          path: contract/target/near/luckout.wasm
          if-no-files-found: error

  # The paths that move USDC, run as real wasm in a local NEAR sandbox (contract/sandbox): gas, the
  # 1 yoctoNEAR on transfers, #[private], and real USDC callbacks, which the unit tests can't see. Its
  # build script downloads the nearcore sandbox binary (about 80 MB) into the cached target folder.
  contract-sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            contract/sandbox/target
          key: sandbox-${{ hashFiles('contract/sandbox/Cargo.lock', 'contract/rust-toolchain.toml') }}
      # The same installer, checked the same way as in contract-wasm.
      - run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/cargo-near-installer.sh" https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh
          echo "76ae71bc6a99864a09cc67c1c0bf82a2b7812d8ab4c93034b680235df6d22028  $RUNNER_TEMP/cargo-near-installer.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/cargo-near-installer.sh"
      - run: cargo near build non-reproducible-wasm --locked
      - run: cargo near build non-reproducible-wasm --locked
        working-directory: contract/test-usdc
      - run: cargo test --locked
        working-directory: contract/sandbox

  # Deploys the server after both jobs pass: the testnet branch to the testnet site, staging to the
  # staging site, main to the mainnet site. Each runs only once its repository variable is "on", and the VM's forced command
  # fixes the branch per site, so this key can't deploy anything else (deploy/remote-deploy.sh).
  deploy:
    if: github.event_name == 'push' && ((github.ref == 'refs/heads/testnet' && vars.DEPLOY_TESTNET == 'on') || (github.ref == 'refs/heads/main' && vars.DEPLOY_MAINNET == 'on') || (github.ref == 'refs/heads/staging' && vars.DEPLOY_STAGING == 'on'))
    needs: [apps, contract]
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.ref_name }}
    steps:
      # The VM's SSH is reachable only over our tailnet. tag:ci may reach nothing there but port 22.
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy over SSH
        env:
          KEY: ${{ github.ref == 'refs/heads/main' && secrets.MAINNET_DEPLOY_KEY || github.ref == 'refs/heads/staging' && secrets.STAGING_DEPLOY_KEY || secrets.TESTNET_DEPLOY_KEY }}
          TARGET: ${{ github.ref == 'refs/heads/main' && vars.MAINNET_SSH_TARGET || github.ref == 'refs/heads/staging' && vars.STAGING_SSH_TARGET || vars.TESTNET_SSH_TARGET }}
          KNOWN_HOSTS: ${{ vars.VM_KNOWN_HOSTS }}
          # The commit the jobs above tested: the VM refuses to deploy anything else.
          SHA: ${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$TARGET" "$SHA"

  # The web goes live only once the API it calls has: apps/web/vercel.json turns off Vercel's own deploys of
  # main and staging, and this calls that branch's Vercel Deploy Hook. A hook URL lets anyone deploy, so it's a
  # secret. Its own job, off the tailnet: the deploy job takes the tailnet's DNS, which doesn't resolve
  # api.vercel.com there.
  web:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the web
        env:
          HOOK_MAIN: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}
          HOOK_STAGING: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
        run: |
          case "$GITHUB_REF_NAME" in
            main) hook=$HOOK_MAIN ;;
            staging) hook=$HOOK_STAGING ;;
            *) exit 0 ;; # testnet keeps Vercel's own deploys until it retires (ADR-0010)
          esac
          if [ -z "$hook" ]; then
            echo "::error::No Vercel Deploy Hook secret for $GITHUB_REF_NAME, so the web was not deployed (deploy/README.md)"
            exit 1
          fi
          # --retry retries transient errors, timeouts included; a second build of the same commit is harmless.
          curl -fsS -m 30 --retry 3 -X POST -o /dev/null "$hook"
          echo "Vercel is building the web for $GITHUB_REF_NAME"

