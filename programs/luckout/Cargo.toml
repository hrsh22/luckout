[package]
name = "luckout"
version = "0.1.0"
description = "Luckout: buy gift cards at the price, or pay a bounded premium for a fair chance at cashback (ADR-0015)"
edition.workspace = true
rust-version.workspace = true
repository = "https://github.com/hrsh22/luckout"

[lib]
crate-type = ["cdylib", "lib"]
name = "luckout"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Mainnet builds, each with its own program id (lib.rs). None: devnet and tests.
staging = []
production = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["event-cpi"] }
anchor-spl = { version = "1.2.2", default-features = false, features = ["token", "token_2022", "solana-v3"] }
orao-solana-vrf = { version = "0.8.1", default-features = false, features = ["cpi"] }
solana-sha256-hasher = "3.1"

[dev-dependencies]
# Cargo.lock pins LiteSVM's Rust-1.89-compatible dependency graph.
litesvm = "0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-account = "4.3"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
