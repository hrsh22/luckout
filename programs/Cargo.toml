[workspace]
members = ["luckout"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
# Smallest build: program rent is paid per byte (ADR-0015, "Rent"); compute stays far under the limits.
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
