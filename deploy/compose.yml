# The VM stack (ADR-0006): server, Postgres with daily dumps, Caddy for HTTPS.
# Run from this folder after filling deploy/.env (see deploy/README.md): docker compose up -d --build
services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://luckout:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/luckout
    depends_on: [db]
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: luckout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: luckout
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  # ponytail: a daily pg_dump kept 14 days on the VM disk; ship dumps off the box if the data grows valuable.
  backup:
    image: postgres:17
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups]
    entrypoint:
      - sh
      - -c
      - while true; do pg_dump -h db -U luckout luckout | gzip > /backups/luckout-$$(date +%F).sql.gz; find /backups -name 'luckout-*.sql.gz' -mtime +14 -delete; sleep 86400; done
    depends_on: [db]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [server]
    restart: unless-stopped

volumes:
  pgdata: {}
  caddy_data: {}
