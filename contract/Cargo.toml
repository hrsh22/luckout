[package]
name = "luckout"
version = "0.1.0"
edition = "2021"
description = "Luckout: buy vouchers at the Bitrefill price, or pay a bounded premium for a fair chance to pay much less"
# Published in the contract's source metadata, so anyone can rebuild the deployed code from it.
repository = "https://github.com/hrsh22/luckout"

# `cargo near build reproducible-wasm` builds inside this exact image, so anyone can rebuild the deployed
# wasm byte for byte and compare its hash with the chain's (CI does it on every push; README "Upgrades").
# Values from `cargo near new` (cargo-near 0.23.0); the tag is descriptive, the digest pins the image.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[workspace]
members = ["test-usdc"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# One-time state upgrade; see `mod migrate` in src/lib.rs.
migrate = []

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
