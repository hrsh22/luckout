[package]
name = "luckout"
version = "0.1.0"
edition = "2021"
description = "Luckout: buy vouchers at the Bitrefill price, or pay a bounded premium for a fair chance to pay much less"

[workspace]
members = ["test-usdc"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
