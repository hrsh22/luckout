# The paths that move USDC, run as real wasm in a local NEAR sandbox (see tests/money.rs). Its own
# workspace, so `cargo test` in contract/ stays fast and offline: only this crate pulls the sandbox.
[package]
name = "luckout-sandbox"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
