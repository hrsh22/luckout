packages:
  - apps/*
  - packages/*
allowBuilds:
  # Its postinstall only checks AppKit versions.
  '@reown/appkit': false
  # Native speed-ups for Node that @solana/web3.js pulls in (the server's Solana client); each has a plain
  # JavaScript fallback, and the browser bundle never builds them anyway.
  bigint-buffer: false
  bufferutil: false
  # Privy's wallet libraries pull it in; it has a plain JavaScript fallback, which the browser bundle uses.
  keccak: false
  utf-8-validate: false
# ws, "memory exhaustion from tiny fragments" (GHSA-96hv-2xvq-fx4p): Privy's wallet libraries pull in 8.x releases
# before the fix; 8.21 fixes it within the same major.
overrides:
  'ws@>=8.0.0 <8.21.0': ^8.21.0
# Advisories pnpm audit (CI's audit job) accepts, each with why. Remove an entry once its fix is installed.
auditConfig:
  ignoreGhsas:
    # zod, "can exhaust memory while validating oversized constrained collections": only the web's wallet
    # library uses it (@reown/appkit's embedded wallet checks the messages from Reown's own iframe with zod 3),
    # so the worst case is one customer's browser tab. Zod 3 has no fixed version (fixed in 4.6.6).
    - GHSA-mrhx-c7xc-m3w5
    # picomatch, "ReDoS through a crafted glob": it reaches us only through the web's wallet library
    # (@reown/appkit > WalletConnect > unstorage > anymatch), in unstorage's file-watching driver, which a browser
    # never runs, and no glob there comes from a visitor. No fixed version is published yet (needs >= 4.0.8).
    - GHSA-fc5q-39xc-vjpf
    # bigint-buffer, "buffer overflow via toBigIntLE()": a bug in its native addon. It reaches us only through the
    # web's Solana libraries (@solana/spl-token > @solana/buffer-layout-utils), which run in the browser, where the
    # package uses its plain JavaScript version (copy, reverse, BigInt) and the addon is never built (allowBuilds
    # above). No fixed version is published (the advisory lists none; npm's latest is 1.1.5).
    - GHSA-3gc7-fjrx-p6mg
    # decode-uri-component, "denial of service via quadratic replacement of percent-encoded runs": it reaches us only
    # through Privy's WalletConnect libraries (query-string 7, which parses WalletConnect pairing URIs), in the
    # visitor's own browser, and our Privy is Solana-only. The fixed 0.5.1 is ESM-only and query-string 7 loads it
    # with require(), so it can't be overridden. Worst case: one visitor's tab, from a URI they opened themselves.
    - GHSA-qr28-fpjm-wq7f
